<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayLio - Iniciar Sesión</title>
 
    <script src="https://cdn.tailwindcss.com"></script>
  
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#42cbf5', // Cyan PayLio
                        secondary: '#f15a24', // Naranja PayLio
                        accent: '#7a7a7a', // Gris PayLio
                        dark: '#0f172a', // Slate 900
                        darker: '#020617', // Slate 950
                        panel: '#1e293b', // Slate 800
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(12px);
        }
     
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-darker text-gray-300 min-h-screen flex items-center justify-center relative overflow-hidden selection:bg-primary/30 font-sans antialiased">

    <!-- Fondo Ambientación PayLio (Modo Oscuro) -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 2px 2px, #334155 1px, transparent 0); background-size: 32px 32px;"></div>
        <!-- Luces de fondo -->
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-primary rounded-full mix-blend-screen filter blur-[128px] opacity-20 animate-pulse-slow"></div>
        <div class="absolute top-1/4 -right-32 w-96 h-96 bg-secondary rounded-full mix-blend-screen filter blur-[128px] opacity-10"></div>
        <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-emerald-500 rounded-full mix-blend-screen filter blur-[128px] opacity-10 animate-pulse-slow"></div>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="w-full max-w-md glass-panel rounded-[2rem] shadow-[0_0_40px_rgba(0,0,0,0.5)] overflow-hidden border border-slate-700/50 relative z-10 p-8 sm:p-10 m-4">
        
        <div class="text-center mb-8 relative z-10">
            <!-- Logo PayLio (Mismo que el Dashboard con efecto) -->
            <div class="flex items-center justify-center gap-3 mb-4 animate-float">
                <div class="relative w-12 h-12 flex items-center justify-center">
                    <div class="absolute w-6 h-6 bg-primary rounded-full top-0 left-0 shadow-[0_0_15px_#42cbf5]"></div>
                    <div class="absolute w-6 h-6 bg-secondary rounded-full bottom-0 right-0 shadow-[0_0_15px_#f15a24]"></div>
                    <div class="absolute w-6 h-6 bg-accent rounded-full opacity-90 mix-blend-screen"></div>
                </div>
                <h1 class="text-4xl font-bold text-white tracking-wide" style="font-family: 'Arial Rounded MT Bold', sans-serif;">Chelitos</h1>
            </div>
            <p id="authSubtitle" class="text-gray-400 text-sm">Controla tu dinero inteligentemente.</p>
        </div>

        <!-- ====== FORMULARIO INICIAR SESIÓN ====== -->
        <form id="loginForm" onsubmit="window.handleEmailLogin(event)" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5 ml-1">Correo Electrónico</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="email" id="loginEmail" required class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary text-sm transition-all bg-slate-900/50 text-white placeholder-slate-600 focus:outline-none" placeholder="tu@correo.com">
                </div>
            </div>
            <div>
                <div class="flex items-center justify-between mb-1.5 px-1">
                    <label class="block text-sm font-medium text-gray-400">Contraseña</label>
                    <button type="button" onclick="window.openModal('forgotPasswordModal', 'forgotPasswordContent')" class="text-xs font-semibold text-primary hover:text-cyan-300 transition-colors">¿Olvidaste tu contraseña?</button>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="loginPassword" required class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary text-sm transition-all bg-slate-900/50 text-white placeholder-slate-600 focus:outline-none" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" id="loginBtn" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-[0_0_15px_rgba(66,203,245,0.3)] text-sm font-bold text-slate-900 bg-primary hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all transform active:scale-[0.98] mt-4">
                Iniciar Sesión
            </button>

            <!-- Botón de Google Oscuro -->
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
                    <div class="relative flex justify-center text-sm"><span class="px-3 bg-[#172033] text-gray-500 text-xs font-medium uppercase tracking-wider rounded-full">O continúa con</span></div>
                </div>
                <button type="button" onclick="window.handleGoogleLogin()" id="googleBtn" class="w-full mt-6 flex items-center justify-center px-4 py-3 border border-slate-700 rounded-xl shadow-sm bg-slate-800 text-sm font-bold text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-600 transition-all transform active:scale-[0.98]">
                    <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
            </div>
        </form>

        <!-- ====== FORMULARIO DE REGISTRO ====== -->
        <form id="registerForm" onsubmit="window.handleEmailRegister(event)" class="space-y-4 relative z-10 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5 ml-1">Nombre Completo</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="regName" required class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-secondary focus:border-secondary text-sm transition-all bg-slate-900/50 text-white placeholder-slate-600 focus:outline-none" placeholder="Juan Pérez">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5 ml-1">Fecha de Nacimiento</label>
                <div class="relative">
                    <i class="fa-regular fa-calendar absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="date" id="regBirth" required class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-secondary focus:border-secondary text-sm transition-all bg-slate-900/50 text-white focus:outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5 ml-1">Correo Electrónico</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="email" id="regEmail" required class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-secondary focus:border-secondary text-sm transition-all bg-slate-900/50 text-white placeholder-slate-600 focus:outline-none" placeholder="tu@correo.com">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5 ml-1">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="regPassword" required minlength="6" class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-secondary focus:border-secondary text-sm transition-all bg-slate-900/50 text-white placeholder-slate-600 focus:outline-none" placeholder="••••••••">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5 ml-1">Confirmar Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="regConfirmPassword" required minlength="6" class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-secondary focus:border-secondary text-sm transition-all bg-slate-900/50 text-white placeholder-slate-600 focus:outline-none" placeholder="••••••••">
                </div>
            </div>
            <button type="submit" id="regBtn" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-[0_0_15px_rgba(241,90,36,0.3)] text-sm font-bold text-white bg-secondary hover:bg-orange-500 focus:outline-none focus:ring-2 focus:ring-secondary/50 transition-all transform active:scale-[0.98] mt-6">
                Crear Cuenta Segura
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-700/50 text-center relative z-10">
            <p class="text-sm text-gray-400" id="authToggleText">
                ¿No tienes cuenta? <button type="button" onclick="window.toggleAuthMode()" class="font-bold text-primary hover:text-cyan-300 transition-colors ml-1">Regístrate gratis</button>
            </p>
        </div>
    </div>

    <div id="forgotPasswordModal" class="fixed inset-0 bg-darker/80 backdrop-blur-md z-[150] hidden flex items-center justify-center opacity-0 transition-all duration-300 px-4">
        <div class="w-full max-w-md glass-panel rounded-[2rem] shadow-[0_0_40px_rgba(0,0,0,0.5)] border border-slate-700/50 p-8 transform scale-95 transition-transform duration-300 relative z-10" id="forgotPasswordContent">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-unlock-keyhole text-primary mr-2"></i> Recuperar Acceso</h2>
                <button onclick="window.closeModal('forgotPasswordModal', 'forgotPasswordContent')" class="text-gray-400 hover:text-white bg-slate-800/80 w-8 h-8 rounded-full flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-gray-400 text-sm mb-6">Ingresa tu correo electrónico y te enviaremos un enlace seguro para restablecer tu contraseña.</p>
            <form onsubmit="window.executePasswordReset(event)" class="space-y-5">
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="email" id="resetEmail" required class="block w-full pl-11 pr-3 py-3 border border-slate-700 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary text-sm transition-all bg-slate-900/50 text-white placeholder-slate-600 focus:outline-none" placeholder="tu@correo.com">
                </div>
                <button type="submit" id="resetBtn" class="w-full bg-primary text-slate-900 font-bold py-3.5 rounded-xl shadow-[0_0_15px_rgba(66,203,245,0.3)] hover:bg-cyan-300 transition-all">Enviar Enlace</button>
            </form>
        </div>
    </div>

 
    <div id="toast" class="fixed bottom-6 right-6 text-white px-7 py-4 rounded-full shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-[90] flex items-center gap-3 font-bold border border-white/10">
        <i id="toastIcon" class="fa-solid fa-circle-info text-xl"></i><span id="toastMsg">Mensaje</span>
    </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
